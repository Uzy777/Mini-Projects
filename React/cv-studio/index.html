<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#202622" />
        <script>
            try {
                const saved = JSON.parse(localStorage.getItem("cv-studio-preferences-v1"));
                document.documentElement.dataset.theme = ["light", "dark"].includes(saved?.theme)
                    ? saved.theme : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            } catch { document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
        </script>
        <title>CV Studio</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
